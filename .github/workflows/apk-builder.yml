name: Build APK

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Android project files
        shell: bash
        run: |
          mkdir -p android-build/app/src/main/assets/www
          mkdir -p android-build/app/src/main/java/com/pollgame/app
          cp index.html android-build/app/src/main/assets/www/index.html

          cat > android-build/settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "poll-game"
          include(":app")
          EOF

          cat > android-build/build.gradle <<'EOF'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > android-build/app/build.gradle <<'EOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }

          android {
            namespace "com.pollgame.app"
            compileSdk 34

            defaultConfig {
              applicationId "com.pollgame.app"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }

            buildTypes {
              release {
                minifyEnabled false
                proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
              jvmTarget = "17"
            }
          }
          EOF

          cat > android-build/app/proguard-rules.pro <<'EOF'
          # Keep defaults
          EOF

          cat > android-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />

            <application
              android:allowBackup="true"
              android:label="Poll Game"
              android:supportsRtl="true"
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > android-build/app/src/main/java/com/pollgame/app/MainActivity.kt <<'EOF'
          package com.pollgame.app

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
            @SuppressLint("SetJavaScriptEnabled")
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)

              val webView = WebView(this)
              setContentView(webView)

              webView.webViewClient = WebViewClient()
              webView.settings.javaScriptEnabled = true
              webView.settings.domStorageEnabled = true
              webView.settings.allowFileAccess = true
              webView.loadUrl("file:///android_asset/www/index.html")
            }
          }
          EOF

      - name: Build release APK
        shell: bash
        run: gradle -p android-build assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: poll-game-apk
          path: android-build/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
